# ============================================================================
#  SAFunded — Netlify configuration
# ============================================================================
#  Build settings are auto-detected by the Netlify Next.js runtime, so no
#  [build] block is needed here.

# ----------------------------------------------------------------------------
#  Canonical-domain redirects
# ----------------------------------------------------------------------------
#  Users sign up on https://safunded.com but Supabase/auth links and shared
#  links sometimes resolved to the raw production Netlify subdomain. These
#  permanent (301) redirects funnel the production Netlify hostnames to the
#  custom domain.
#
#  Only the PRODUCTION subdomains are matched here. Because each rule pins a
#  full scheme + host in `from`, deploy-preview hosts
#  (deploy-preview-123--safunded.netlify.app) and branch-deploy hosts
#  (somebranch--safunded.netlify.app) do NOT match and keep working normally.
# ----------------------------------------------------------------------------

[[redirects]]
  from = "https://main--safunded.netlify.app/*"
  to = "https://safunded.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://safunded.netlify.app/*"
  to = "https://safunded.com/:splat"
  status = 301
  force = true

# ----------------------------------------------------------------------------
#  Live-Tracking proxy
# ----------------------------------------------------------------------------
#  The customer dashboard's live-tracking widget calls ONLY
#  safunded.com/api/tracking/<token>. Netlify fetches the data server-side
#  (status = 200 rewrite), so the upstream tracking domain never appears in the
#  client code or the browser's network tab.
#
#  Placed before any catch-all rule so the proxy always wins for this path.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/api/tracking/*"
  to = "https://safcheck.de/api/public/accounts/:splat"
  status = 200
  force = true
